<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABATA TIMER</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1a1a1e;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-prep: #f59e0b;
            --accent-work: #3b82f6;
            --accent-rest: #10b981;
            --accent-finish: #8b5cf6;
            --btn-primary: #3b82f6;
            --btn-primary-hover: #2563eb;
            --btn-secondary: #27272a;
            --btn-secondary-hover: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 16px;
            transition: background-color 0.5s ease;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            justify-content: center;
        }

        /* ステータスバッジ */
        .status-badge {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            padding: 6px 20px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            transition: color 0.3s ease;
        }

        /* タイマー表示 */
        .timer-display {
            font-size: 5.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            line-height: 1;
        }

        /* セット数・フェーズ情報 */
        .info-text {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-variant-numeric: tabular-nums;
        }

        /* コントロールボタン群 */
        .controls {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 360px;
        }

        .btn {
            flex: 1;
            padding: 16px 0;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-secondary-action {
            background-color: var(--btn-secondary);
            color: var(--text-color);
        }
        .btn-secondary-action:hover {
            background-color: var(--btn-secondary-hover);
        }

        .btn-primary-action {
            background-color: var(--btn-primary);
            color: #ffffff;
        }
        .btn-primary-action:hover {
            background-color: var(--btn-primary-hover);
        }

        /* 設定モーダル */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            padding: 16px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .time-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-inputs input, .setting-group select {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid #3f3f46;
            color: var(--text-color);
            padding: 12px;
            font-size: 1rem;
            border-radius: 10px;
            text-align: center;
        }

        .time-inputs span {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .modal-close-btn {
            background: var(--btn-primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="statusBadge" class="status-badge" style="color: var(--accent-prep);">準備中</div>
        <div id="timerDisplay" class="timer-display">00:10</div>
        <div id="infoText" class="info-text">セット 1 / 8</div>

        <div class="controls">
            <button id="btnSettings" class="btn btn-secondary-action">設定</button>
            <button id="btnAction" class="btn btn-primary-action">スタート</button>
        </div>
    </div>

    <!-- 設定モーダル -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">タイマー設定</div>
            
            <div class="setting-group">
                <span class="setting-label">準備時間 (Prep)</span>
                <div class="time-inputs">
                    <input type="number" id="prepMin" min="0" max="59" value="0"><span>分</span>
                    <input type="number" id="prepSec" min="0" max="59" value="10"><span>秒</span>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">運動時間 (Work)</span>
                <div class="time-inputs">
                    <input type="number" id="workMin" min="0" max="59" value="0"><span>分</span>
                    <input type="number" id="workSec" min="0" max="59" value="20"><span>秒</span>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">休憩時間 (Rest)</span>
                <div class="time-inputs">
                    <input type="number" id="restMin" min="0" max="59" value="0"><span>分</span>
                    <input type="number" id="restSec" min="0" max="59" value="10"><span>秒</span>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">総セット数</span>
                <input type="number" id="inputSets" min="1" max="99" value="8">
            </div>

            <div class="setting-group">
                <span class="setting-label">サウンド</span>
                <select id="selectSound">
                    <option value="beep">電子音 (ビープ)</option>
                    <option value="soft">ソフト音</option>
                    <option value="none">サイレント (鳴らさない)</option>
                </select>
            </div>

            <button id="modalCloseBtn" class="modal-close-btn">保存して閉じる</button>
        </div>
    </div>

    <script>
        // 設定値のデフォルト
        let config = {
            prep: 10,
            work: 20,
            rest: 10,
            sets: 8,
            sound: 'beep'
        };

        // アプリの状態
        let currentState = 'IDLE'; // IDLE, RUNNING, PAUSED, FINISHED
        let subState = 'PREP';     // PREP, WORK, REST
        let currentSet = 1;
        let timeLeft = config.prep;
        let timerInterval = null;
        let wakeLock = null;
        let audioCtx = null;

        // DOM要素
        const statusBadge = document.getElementById('statusBadge');
        const timerDisplay = document.getElementById('timerDisplay');
        const infoText = document.getElementById('infoText');
        const btnAction = document.getElementById('btnAction');
        const btnSettings = document.getElementById('btnSettings');
        const settingsModal = document.getElementById('settingsModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        // AudioContextの初期化
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // サウンド再生
        function playSound(type) {
            if (config.sound === 'none') return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'start') {
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.setValueAtTime(880, now + 0.15); // A5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'countdown') {
                osc.frequency.setValueAtTime(440, now); // A4
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'end' || type === 'finish') {
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.15);
                osc.frequency.setValueAtTime(659.25, now + 0.3);
                osc.frequency.setValueAtTime(880, now + 0.45);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc.start(now);
                osc.stop(now + 0.8);
            }
        }

        // 画面スリープ防止 (Screen Wake Lock API)
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }
        }

        // 時間フォーマット (MM:SS)
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // ローカルストレージから設定読み込み
        function loadSettingsFromStorage() {
            const saved = localStorage.getItem('tabata_config_v4');
            if (saved) {
                try {
                    config = JSON.parse(saved);
                } catch(e) {}
            }
            // フォームに反映
            document.getElementById('prepMin').value = Math.floor(config.prep / 60);
            document.getElementById('prepSec').value = config.prep % 60;
            document.getElementById('workMin').value = Math.floor(config.work / 60);
            document.getElementById('workSec').value = config.work % 60;
            document.getElementById('restMin').value = Math.floor(config.rest / 60);
            document.getElementById('restSec').value = config.rest % 60;
            document.getElementById('inputSets').value = config.sets;
            document.getElementById('selectSound').value = config.sound || 'beep';

            resetTimer();
        }

        // ローカルストレージへ設定保存
        function saveSettingsToStorage() {
            const prepM = parseInt(document.getElementById('prepMin').value);
            const prepS = parseInt(document.getElementById('prepSec').value);
            const workM = parseInt(document.getElementById('workMin').value);
            const workS = parseInt(document.getElementById('workSec').value);
            const restM = parseInt(document.getElementById('restMin').value);
            const restS = parseInt(document.getElementById('restSec').value);

            config.prep = ((isNaN(prepM) ? 0 : prepM) * 60) + (isNaN(prepS) ? 0 : prepS);
            config.work = ((isNaN(workM) ? 0 : workM) * 60) + (isNaN(workS) ? 20 : workS);
            config.rest = ((isNaN(restM) ? 0 : restM) * 60) + (isNaN(restS) ? 10 : restS);
            config.sets = parseInt(document.getElementById('inputSets').value) || 8;
            config.sound = document.getElementById('selectSound').value;

            localStorage.setItem('tabata_config_v4', JSON.stringify(config));
            resetTimer();
        }

        // タイマーリセット
        function resetTimer() {
            stopTimer();
            releaseWakeLock();
            currentState = 'IDLE';
            currentSet = 1;
            
            if (config.prep > 0) {
                subState = 'PREP';
                timeLeft = config.prep;
                statusBadge.textContent = '準備中';
                statusBadge.style.color = 'var(--accent-prep)';
                document.body.style.backgroundColor = '#18120b';
            } else {
                subState = 'WORK';
                timeLeft = config.work;
                statusBadge.textContent = '運動中';
                statusBadge.style.color = 'var(--accent-work)';
                document.body.style.backgroundColor = '#0c192c';
            }
            
            timerDisplay.textContent = formatTime(timeLeft);
            infoText.textContent = `セット ${currentSet} / ${config.sets}`;
            btnAction.textContent = 'スタート';
            btnSettings.style.display = 'block';
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        // タイマーのカウントダウン処理
        function runInterval() {
            stopTimer();
            let lastTick = performance.now();

            timerInterval = setInterval(() => {
                const now = performance.now();
                const delta = (now - lastTick) / 1000;
                
                if (delta >= 0.9) {
                    lastTick = now;
                    timeLeft--;

                    if (timeLeft > 0) {
                        if (timeLeft <= 3) {
                            playSound('countdown');
                        }
                    } else {
                        // フェーズ切り替え
                        transitionNextPhase();
                    }
                    timerDisplay.textContent = formatTime(timeLeft);
                }
            }, 100);
        }

        // フェーズ移行
        function transitionNextPhase() {
            if (subState === 'PREP') {
                subState = 'WORK';
                timeLeft = config.work;
                statusBadge.textContent = '運動中';
                statusBadge.style.color = 'var(--accent-work)';
                document.body.style.backgroundColor = '#0c192c';
                playSound('start');
            } else if (subState === 'WORK') {
                if (currentSet >= config.sets) {
                    // 全セット終了
                    finishTimer();
                    return;
                }
                if (config.rest > 0) {
                    subState = 'REST';
                    timeLeft = config.rest;
                    statusBadge.textContent = '休憩中';
                    statusBadge.style.color = 'var(--accent-rest)';
                    document.body.style.backgroundColor = '#062014';
                    playSound('end');
                } else {
                    currentSet++;
                    subState = 'WORK';
                    timeLeft = config.work;
                    statusBadge.textContent = '運動中';
                    statusBadge.style.color = 'var(--accent-work)';
                    document.body.style.backgroundColor = '#0c192c';
                    infoText.textContent = `セット ${currentSet} / ${config.sets}`;
                    playSound('start');
                }
            } else if (subState === 'REST') {
                currentSet++;
                subState = 'WORK';
                timeLeft = config.work;
                statusBadge.textContent = '運動中';
                statusBadge.style.color = 'var(--accent-work)';
                document.body.style.backgroundColor = '#0c192c';
                infoText.textContent = `セット ${currentSet} / ${config.sets}`;
                playSound('start');
            }
        }

        // 完了
        function finishTimer() {
            stopTimer();
            releaseWakeLock();
            currentState = 'FINISHED';
            statusBadge.textContent = '完了！';
            statusBadge.style.color = 'var(--accent-finish)';
            document.body.style.backgroundColor = '#1e112b';
            timerDisplay.textContent = '00:00';
            infoText.textContent = `全 ${config.sets} セット完了`;
            btnAction.textContent = 'リセット';
            btnSettings.style.display = 'block';
            playSound('finish');
        }

        // アクションボタン（スタート / 一時停止 / 再開 / リセット）の挙動
        btnAction.addEventListener('click', () => {
            initAudio();
            if (currentState === 'IDLE') {
                currentState = 'RUNNING';
                btnSettings.style.display = 'none';
                btnAction.textContent = '一時停止';
                requestWakeLock();
                playSound('start');
                runInterval();
            } else if (currentState === 'RUNNING') {
                currentState = 'PAUSED';
                stopTimer();
                releaseWakeLock();
                btnAction.textContent = '再開';
                btnSettings.style.display = 'block';
            } else if (currentState === 'PAUSED') {
                currentState = 'RUNNING';
                btnSettings.style.display = 'none';
                btnAction.textContent = '一時停止';
                requestWakeLock();
                runInterval();
            } else if (currentState === 'FINISHED') {
                resetTimer();
            }
        });

        // 設定モーダル開閉
        btnSettings.addEventListener('click', () => {
            settingsModal.classList.add('active');
        });

        modalCloseBtn.addEventListener('click', () => {
            saveSettingsToStorage();
            settingsModal.classList.remove('active');
        });

        // モダールの外側タップで保存して閉じる
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                saveSettingsToStorage();
                settingsModal.classList.remove('active');
            }
        });

        // 起動時に設定を読み込む
        loadSettingsFromStorage();
    </script>
</body>
</html>
