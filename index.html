<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTI TABATA TIMER</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1a1a1e;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-prep: #f59e0b;
            --accent-work: #3b82f6;
            --accent-rest: #10b981;
            --accent-finish: #8b5cf6;
            --btn-primary: #3b82f6;
            --btn-primary-hover: #2563eb;
            --btn-secondary: #27272a;
            --btn-secondary-hover: #3f3f46;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            transition: background-color 0.5s ease;
            overflow-x: hidden;
        }

        .view {
            width: 100%;
            max-width: 480px;
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .view.active {
            display: flex;
        }

        /* --- リストビュー画面 --- */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .btn-add {
            background-color: var(--btn-primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .timer-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            overflow-y: auto;
        }

        .timer-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid #27272a;
            transition: border-color 0.2s;
        }

        .timer-card:hover {
            border-color: var(--btn-primary);
        }

        .timer-card-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .timer-card-info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .timer-card-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
        }
        .icon-btn:hover {
            color: var(--text-color);
        }
        .icon-btn.delete:hover {
            color: var(--danger);
        }

        /* --- タイマー実行画面 --- */
        .timer-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .back-btn {
            align-self: flex-start;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-badge {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            padding: 6px 20px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            transition: color 0.3s ease;
        }

        .timer-display {
            font-size: 5.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            line-height: 1;
        }

        .info-text {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 360px;
        }

        .btn {
            flex: 1;
            padding: 16px 0;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-secondary-action {
            background-color: var(--btn-secondary);
            color: var(--text-color);
        }
        .btn-secondary-action:hover {
            background-color: var(--btn-secondary-hover);
        }

        .btn-primary-action {
            background-color: var(--btn-primary);
            color: #ffffff;
        }
        .btn-primary-action:hover {
            background-color: var(--btn-primary-hover);
        }

        /* --- 設定モーダル --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            padding: 16px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .time-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-inputs input, .setting-group select, .setting-group input[type="text"] {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid #3f3f46;
            color: var(--text-color);
            padding: 12px;
            font-size: 1rem;
            border-radius: 10px;
            text-align: center;
        }
        .setting-group input[type="text"] {
            text-align: left;
        }

        .time-inputs span {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .modal-btn.save {
            background: var(--btn-primary);
            color: white;
        }
        .modal-btn.cancel {
            background: var(--btn-secondary);
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <!-- VIEW 1: タバタメニュー一覧 -->
    <div id="listView" class="view active">
        <div class="list-header">
            <h1 class="app-title">タバタタイマー一覧</h1>
            <button id="btnAddTimer" class="btn-add">＋ 新規作成</button>
        </div>
        <div id="timerList" class="timer-list">
            <!-- JavaScriptで動的にカードが生成されます -->
        </div>
    </div>

    <!-- VIEW 2: タイマー実行画面 -->
    <div id="timerView" class="view">
        <button id="btnBackToList" class="back-btn">← 一覧に戻る</button>
        
        <div class="timer-container">
            <div id="statusBadge" class="status-badge" style="color: var(--accent-prep);">準備中</div>
            <div id="timerDisplay" class="timer-display">00:10</div>
            <div id="infoText" class="info-text">セット 1 / 8</div>

            <div class="controls">
                <button id="btnSettings" class="btn btn-secondary-action">設定</button>
                <button id="btnAction" class="btn btn-primary-action">スタート</button>
            </div>
        </div>
    </div>

    <!-- 設定・編集モーダル -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div id="modalTitle" class="modal-title">タイマー設定</div>
            
            <div class="setting-group">
                <span class="setting-label">メニュー名</span>
                <input type="text" id="inputTitle" value="スタンダードタバタ">
            </div>

            <div class="setting-group">
                <span class="setting-label">準備時間 (Prep)</span>
                <div class="time-inputs">
                    <input type="number" id="prepMin" min="0" max="59" value="0"><span>分</span>
                    <input type="number" id="prepSec" min="0" max="59" value="10"><span>秒</span>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">運動時間 (Work)</span>
                <div class="time-inputs">
                    <input type="number" id="workMin" min="0" max="59" value="0"><span>分</span>
                    <input type="number" id="workSec" min="0" max="59" value="20"><span>秒</span>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">休憩時間 (Rest)</span>
                <div class="time-inputs">
                    <input type="number" id="restMin" min="0" max="59" value="0"><span>分</span>
                    <input type="number" id="restSec" min="0" max="59" value="10"><span>秒</span>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">総セット数</span>
                <input type="number" id="inputSets" min="1" max="99" value="8">
            </div>

            <div class="setting-group">
                <span class="setting-label">サウンド</span>
                <select id="selectSound">
                    <option value="beep">電子音 (ビープ)</option>
                    <option value="bell">鐘・ゴング (カーン！)</option>
                    <option value="sharp">シャープ (高音ピピッ)</option>
                    <option value="none">サイレント (鳴らさない)</option>
                </select>
            </div>

            <div class="setting-group">
                <span class="setting-label">ボリューム (音量: <span id="volVal">50</span>%)</span>
                <input type="range" id="inputVolume" min="0" max="100" value="50" style="accent-color: var(--btn-primary);">
            </div>

            <div class="modal-actions">
                <button id="modalCancelBtn" class="modal-btn cancel">キャンセル</button>
                <button id="modalSaveBtn" class="modal-btn save">保存</button>
            </div>
        </div>
    </div>

    <script>
        const defaultTimers = [
            {
                id: 'default_1',
                title: 'スタンダードタバタ',
                prep: 10,
                work: 20,
                rest: 10,
                sets: 8,
                sound: 'beep',
                volume: 50
            }
        ];

        let timers = [];
        let currentTimerId = null;
        let activeConfig = null;

        let currentState = 'IDLE'; 
        let subState = 'PREP';     
        let currentSet = 1;
        let timeLeft = 10;
        let timerInterval = null;
        let wakeLock = null;
        let audioCtx = null;

        const listView = document.getElementById('listView');
        const timerView = document.getElementById('timerView');
        const timerListEl = document.getElementById('timerList');
        const btnAddTimer = document.getElementById('btnAddTimer');
        const btnBackToList = document.getElementById('btnBackToList');

        const statusBadge = document.getElementById('statusBadge');
        const timerDisplay = document.getElementById('timerDisplay');
        const infoText = document.getElementById('infoText');
        const btnAction = document.getElementById('btnAction');
        const btnSettings = document.getElementById('btnSettings');

        const settingsModal = document.getElementById('settingsModal');
        const modalTitle = document.getElementById('modalTitle');
        const inputTitle = document.getElementById('inputTitle');
        const prepMin = document.getElementById('prepMin');
        const prepSec = document.getElementById('prepSec');
        const workMin = document.getElementById('workMin');
        const workSec = document.getElementById('workSec');
        const restMin = document.getElementById('restMin');
        const restSec = document.getElementById('restSec');
        const inputSets = document.getElementById('inputSets');
        const selectSound = document.getElementById('selectSound');
        const inputVolume = document.getElementById('inputVolume');
        const volVal = document.getElementById('volVal');
        const modalSaveBtn = document.getElementById('modalSaveBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');

        inputVolume.addEventListener('input', () => {
            volVal.textContent = inputVolume.value;
        });

        function loadTimers() {
            const saved = localStorage.getItem('tabata_multi_timers_v2');
            if (saved) {
                try {
                    timers = JSON.parse(saved);
                } catch(e) {
                    timers = defaultTimers;
                }
            } else {
                timers = defaultTimers;
            }
            renderTimerList();
        }

        function saveTimers() {
            localStorage.setItem('tabata_multi_timers_v2', JSON.stringify(timers));
        }

        function renderTimerList() {
            timerListEl.innerHTML = '';
            timers.forEach(t => {
                const card = document.createElement('div');
                card.className = 'timer-card';
                
                const workMinF = Math.floor(t.work / 60);
                const workSecF = t.work % 60;
                const restSecF = t.rest % 60;

                card.innerHTML = `
                    <div class="timer-card-info" style="flex:1; cursor:pointer;">
                        <h3>${escapeHtml(t.title)}</h3>
                        <p>運動: ${workMinF > 0 ? workMinF+'分' : ''}${workSecF}秒 / 休憩: ${restSecF}秒 / ${t.sets}セット</p>
                    </div>
                    <div class="timer-card-actions">
                        <button class="icon-btn edit" title="編集">✏️</button>
                        <button class="icon-btn delete" title="削除">🗑️</button>
                    </div>
                `;

                card.querySelector('.timer-card-info').addEventListener('click', () => {
                    startTimerSession(t.id);
                });

                card.querySelector('.icon-btn.edit').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModal(t.id);
                });

                card.querySelector('.icon-btn.delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (timers.length <= 1) {
                        alert('最後の1つは削除できません。');
                        return;
                    }
                    if (confirm(`「${t.title}」を削除しますか？`)) {
                        timers = timers.filter(item => item.id !== t.id);
                        saveTimers();
                        renderTimerList();
                    }
                });

                timerListEl.appendChild(card);
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&'`<>"]/g, match => ({
                '&': '&amp;',
                "'": '&#x27;',
                '`': '&#x60;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
            }[match]));
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // サウンド合成・再生エンジン
        function playSound(type) {
            if (!activeConfig || activeConfig.sound === 'none') return;
            initAudio();
            if (!audioCtx) return;

            const mode = activeConfig.sound;
            const vol = (activeConfig.volume !== undefined ? activeConfig.volume : 50) / 100;
            const now = audioCtx.currentTime;

            if (mode === 'bell') {
                // カーンと響く鐘（ゴング）音：複数の倍音を重ねる
                const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                freqs.forEach((f, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now);

                    const attenuation = 1 / (index + 1);
                    gain.gain.setValueAtTime(0.3 * vol * attenuation, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (type === 'finish' ? 2.0 : 1.2));

                    osc.start(now);
                    osc.stop(now + (type === 'finish' ? 2.0 : 1.2));
                });
            } else if (mode === 'sharp') {
                // シャープな高音（ピピッ）
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.type = 'square';
                if (type === 'countdown') {
                    osc.frequency.setValueAtTime(880, now);
                    gain.gain.setValueAtTime(0.1 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else {
                    osc.frequency.setValueAtTime(1046.50, now);
                    osc.frequency.setValueAtTime(1318.51, now + 0.1);
                    gain.gain.setValueAtTime(0.15 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } else {
                // 従来の電子音（beep）
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'start') {
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.setValueAtTime(880, now + 0.15);
                    gain.gain.setValueAtTime(0.15 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'countdown') {
                    osc.frequency.setValueAtTime(440, now);
                    gain.gain.setValueAtTime(0.1 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'end' || type === 'finish') {
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.15);
                    osc.frequency.setValueAtTime(659.25, now + 0.3);
                    osc.frequency.setValueAtTime(880, now + 0.45);
                    gain.gain.setValueAtTime(0.2 * vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                    osc.start(now);
                    osc.stop(now + 0.8);
                }
            }
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function startTimerSession(id) {
            currentTimerId = id;
            activeConfig = timers.find(t => t.id === id);
            if (!activeConfig) return;

            listView.classList.remove('active');
            timerView.classList.add('active');
            resetTimer();
        }

        function resetTimer() {
            stopTimer();
            releaseWakeLock();
            currentState = 'IDLE';
            currentSet = 1;
            
            if (activeConfig.prep > 0) {
                subState = 'PREP';
                timeLeft = activeConfig.prep;
                statusBadge.textContent = '準備中';
                statusBadge.style.color = 'var(--accent-prep)';
                document.body.style.backgroundColor = '#18120b';
            } else {
                subState = 'WORK';
                timeLeft = activeConfig.work;
                statusBadge.textContent = '運動中';
                statusBadge.style.color = 'var(--accent-work)';
                document.body.style.backgroundColor = '#0c192c';
            }
            
            timerDisplay.textContent = formatTime(timeLeft);
            infoText.textContent = `セット ${currentSet} / ${activeConfig.sets}`;
            btnAction.textContent = 'スタート';
            btnSettings.style.display = 'block';
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            releaseWakeLock();
        }

        function runInterval() {
            stopTimer();
            requestWakeLock();
            let lastTick = performance.now();

            timerInterval = setInterval(() => {
                const now = performance.now();
                const delta = (now - lastTick) / 1000;
                
                if (delta >= 0.9) {
                    lastTick = now;
                    timeLeft--;

                    if (timeLeft > 0) {
                        if (timeLeft <= 3) {
                            playSound('countdown');
                        }
                    } else {
                        transitionNextPhase();
                    }
                    timerDisplay.textContent = formatTime(timeLeft);
                }
            }, 100);
        }

        function transitionNextPhase() {
            if (subState === 'PREP') {
                subState = 'WORK';
                timeLeft = activeConfig.work;
                statusBadge.textContent = '運動中';
                statusBadge.style.color = 'var(--accent-work)';
                document.body.style.backgroundColor = '#0c192c';
                playSound('start');
            } else if (subState === 'WORK') {
                if (currentSet >= activeConfig.sets) {
                    finishTimer();
                    return;
                }
                if (activeConfig.rest > 0) {
                    subState = 'REST';
                    timeLeft = activeConfig.rest;
                    statusBadge.textContent = '休憩中';
                    statusBadge.style.color = 'var(--accent-rest)';
                    document.body.style.backgroundColor = '#062014';
                    playSound('end');
                } else {
                    currentSet++;
                    subState = 'WORK';
                    timeLeft = activeConfig.work;
                    statusBadge.textContent = '運動中';
                    statusBadge.style.color = 'var(--accent-work)';
                    document.body.style.backgroundColor = '#0c192c';
                    infoText.textContent = `セット ${currentSet} / ${activeConfig.sets}`;
                    playSound('start');
                }
            } else if (subState === 'REST') {
                currentSet++;
                subState = 'WORK';
                timeLeft = activeConfig.work;
                statusBadge.textContent = '運動中';
                statusBadge.style.color = 'var(--accent-work)';
                document.body.style.backgroundColor = '#0c192c';
                infoText.textContent = `セット ${currentSet} / ${activeConfig.sets}`;
                playSound('start');
            }
        }

        function finishTimer() {
            stopTimer();
            currentState = 'FINISHED';
            statusBadge.textContent = '完了！';
            statusBadge.style.color = 'var(--accent-finish)';
            document.body.style.backgroundColor = '#1e112b';
            timerDisplay.textContent = '00:00';
            infoText.textContent = `全 ${activeConfig.sets} セット完了`;
            btnAction.textContent = 'リセット';
            btnSettings.style.display = 'block';
            playSound('finish');
        }

        btnAction.addEventListener('click', () => {
            initAudio();
            if (currentState === 'IDLE') {
                currentState = 'RUNNING';
                btnSettings.style.display = 'none';
                btnAction.textContent = '一時停止';
                playSound('start');
                runInterval();
            } else if (currentState === 'RUNNING') {
                currentState = 'PAUSED';
                stopTimer();
                btnAction.textContent = '再開';
                btnSettings.style.display = 'block';
            } else if (currentState === 'PAUSED') {
                currentState = 'RUNNING';
                btnSettings.style.display = 'none';
                btnAction.textContent = '一時停止';
                runInterval();
            } else if (currentState === 'FINISHED') {
                resetTimer();
            }
        });

        btnBackToList.addEventListener('click', () => {
            stopTimer();
            timerView.classList.remove('active');
            listView.classList.add('active');
            document.body.style.backgroundColor = 'var(--bg-color)';
            renderTimerList();
        });

        let editingId = null;

        function openModal(id = null) {
            editingId = id;
            if (id) {
                modalTitle.textContent = 'タイマー設定編集';
                const target = timers.find(t => t.id === id);
                if (target) {
                    inputTitle.value = target.title;
                    prepMin.value = Math.floor(target.prep / 60);
                    prepSec.value = target.prep % 60;
                    workMin.value = Math.floor(target.work / 60);
                    workSec.value = target.work % 60;
                    restMin.value = Math.floor(target.rest / 60);
                    restSec.value = target.rest % 60;
                    inputSets.value = target.sets;
                    selectSound.value = target.sound || 'beep';
                    inputVolume.value = target.volume !== undefined ? target.volume : 50;
                    volVal.textContent = inputVolume.value;
                }
            } else {
                modalTitle.textContent = '新規タバタ作成';
                inputTitle.value = '新しいタバタ';
                prepMin.value = 0;
                prepSec.value = 10;
                workMin.value = 0;
                workSec.value = 20;
                restMin.value = 0;
                restSec.value = 10;
                inputSets.value = 8;
                selectSound.value = 'bell'; // 新規は鐘の音をデフォルトにしてもお洒落です
                inputVolume.value = 50;
                volVal.textContent = '50';
            }
            settingsModal.classList.add('active');
        }

        btnAddTimer.addEventListener('click', () => openModal(null));
        btnSettings.addEventListener('click', () => openModal(currentTimerId));

        modalCancelBtn.addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        modalSaveBtn.addEventListener('click', () => {
            const pM = parseInt(prepMin.value);
            const pS = parseInt(prepSec.value);
            const wM = parseInt(workMin.value);
            const wS = parseInt(workSec.value);
            const rM = parseInt(restMin.value);
            const rS = parseInt(restSec.value);

            const newConfig = {
                id: editingId ? editingId : 'timer_' + Date.now(),
                title: inputTitle.value.trim() || '無題のタバタ',
                prep: ((isNaN(pM) ? 0 : pM) * 60) + (isNaN(pS) ? 0 : pS),
                work: ((isNaN(wM) ? 0 : wM) * 60) + (isNaN(wS) ? 20 : wS),
                rest: ((isNaN(rM) ? 0 : rM) * 60) + (isNaN(rS) ? 10 : rS),
                sets: parseInt(inputSets.value) || 8,
                sound: selectSound.value,
                volume: parseInt(inputVolume.value)
            };

            if (editingId) {
                const index = timers.findIndex(t => t.id === editingId);
                if (index !== -1) {
                    timers[index] = newConfig;
                }
                if (currentTimerId === editingId) {
                    activeConfig = newConfig;
                    resetTimer();
                }
            } else {
                timers.push(newConfig);
            }

            saveTimers();
            renderTimerList();
            settingsModal.classList.remove('active');
        });

        loadTimers();
    </script>
</body>
</html>
